[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gasp"
version = "0.7.0"
description = "Local capture, labelling and baseline training for TI IWR6843AOP silent-speech research"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "numpy==2.2.5",
  "scipy==1.15.3", "scikit-learn==1.6.1", "pyserial==3.5",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
training = ["torch==2.9.1"]
macos-build = ["pyinstaller==6.16.0", "pyinstaller-hooks-contrib==2026.9"]

[project.scripts]
gasp = "gasp.cli:main"

[tool.setuptools.packages.find]
include = ["gasp*"]

[tool.setuptools.package-data]
gasp = ["static/*", "static/brand/*.png", "profiles/*", "baseline_sentences.txt", "practice_sentences.txt", "build-info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
