name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.0
      - run: uv sync --frozen --extra dev
      - run: .venv/bin/python -u -m pytest -vv -o faulthandler_timeout=45
      - run: .venv/bin/python enclosure/iwr6843aop/checks/check_meshes.py
      - name: Verify capture enclosure files
        working-directory: enclosure/capture_stack
        run: shasum -a 256 -c SHA256SUMS.txt
      - run: .venv/bin/python enclosure/capture_stack/checks/check_meshes.py
      - name: Verify standalone enclosure and desktop dock files
        working-directory: enclosure/iwr6843aop
        run: |
          shasum -a 256 -c SHA256SUMS_v1_2.txt
          shasum -a 256 -c DESKTOP_STAND_SHA256SUMS.txt
      - run: .venv/bin/python enclosure/iwr6843aop/checks/check_dock_meshes.py
      - if: runner.os == 'macOS'
        run: |
          uv sync --frozen --extra dev --extra macos-build
          swiftc macos/Sources/RecordingGesture.swift macos/tests/main.swift -o /tmp/gasp-gesture-tests
          /tmp/gasp-gesture-tests
          ./scripts/build-macos.sh
          codesign --verify --deep --strict dist/Gasp.app
          .venv/bin/python tests/smoke_bundle.py dist/Gasp.app
